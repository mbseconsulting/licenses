name: Feature request
description: A change or addition to what this project does
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: What the project would do instead, and what a user would write or click.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact on users
      description: >
        What happens to someone who does not opt in. Answer this explicitly; silence is not an
        acceptable answer.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional.
    validations:
      required: false
